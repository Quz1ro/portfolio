function casePage(){const c=M[lang].Case;return `${header()}<main class="case-page container"><a href="#work" class="case-back" onclick="showHome()">← ${c.back}</a><div class="case-head"><span class="section-index">${c.eyebrow}</span><h1>AI Body Analyzer<span class="hero-title-dot">.</span></h1><p>${c.subtitle}</p><div class="case-actions"><a href="https://github.com/Quz1ro/AI-Body-Analyzer" class="button button-light" target="_blank">${c.source} ↗</a><span class="case-offline">▢ ${c.offline}</span></div></div><div class="case-hero-art"><div class="case-art-label"><span>COMPUTER VISION // AI ANALYSIS</span><span>FIG 001 / CONCEPT</span></div><div class="figure-art figure-compact">${FIGURE}</div><div class="case-art-bottom"><span>POSE ESTIMATION</span><span>IMAGE-BASED EXPLORATION</span></div></div><section class="case-section case-overview"><div><span class="section-index">${c.overview}</span><h2>${c.overviewTitle}</h2></div><p>${c.overviewText}</p></section><section class="case-section"><div><span class="section-index">${c.technical}</span><h2>${c.technicalTitle}</h2></div><div class="architecture">${[c.stage1,c.stage2,c.stage3,c.stage4].map((x,i)=>`<div class="architecture-step"><span>0${i+1}</span><span>✳</span><strong>${x}</strong></div>`).join('')}</div><div class="case-tags"><span class="overline">${c.techTitle}</span><div class="skill-pills">${['Next.js 16','React 19','TypeScript','Python','FastAPI','MediaPipe','Google Gemini','PostgreSQL','Docker'].map(x=>`<span>${x}</span>`).join('')}</div></div></section><section class="case-section"><div><span class="section-index">${c.features}</span><h2>${c.featuresTitle}</h2></div><div class="case-features">${[[c.f1,c.f1desc],[c.f2,c.f2desc],[c.f3,c.f3desc],[c.f4,c.f4desc]].map(([x,y],i)=>`<div class="case-feature"><div class="case-feature-index">0${i+1} / 04 ✳</div><h3>${x}</h3><p>${y}</p></div>`).join('')}</div></section><section class="case-section case-overview"><div><span class="section-index">${c.contribution}</span><h2>${c.contributionTitle}</h2></div><p>${c.contributionText}</p></section><section class="case-section case-overview"><div><span class="section-index">${c.limitations}</span><h2>${c.limitationsTitle}</h2></div><div><p>${c.limitationsText}</p><div class="case-disclaimer">${c.disclaimer}</div><p class="case-readme">${c.repoReadme}</p></div></section><div class="case-next"><span>${c.end}</span><a href="#work" onclick="showHome()">${c.back} ↗</a></div></main>`;}
function render(){document.documentElement.lang=lang;document.title=M[lang].Meta.title;document.getElementById('app').innerHTML='<div class="ambient-grid"></div>'+(view==='home'?home():casePage());if(view==='home')startTerminal();}
function switchLang(){lang=lang==='en'?'uk':'en';render();window.scrollTo({top:0,behavior:'instant'});}
function showHome(){if(view!=='home'){view='home';render();}}
function showCase(e){if(e)e.preventDefault();view='case';render();window.scrollTo({top:0,behavior:'instant'});}
function toggleMenu(force){const m=document.getElementById('mobile-nav');if(m)m.style.display=force===false?'none':(m.style.display==='flex'?'none':'flex');}
function sendPreview(event){event.preventDefault();const d=new FormData(event.target);const subject=encodeURIComponent('Portfolio contact from '+d.get('name'));const body=encodeURIComponent(d.get('message')+'\n\nReply to: '+d.get('email'));window.location.href=`mailto:kovalevich.vadimm@gmail.com?subject=${subject}&body=${body}`;}
async function startTerminal(){const box=document.getElementById('terminal-lines');if(!box)return;let data=M[lang].Hero;const lines=[[data.term1command,data.term1answer],[data.term2command,data.term2answer],[data.term3command,data.term3answer]];let out='<div class="terminal-comment">// identity initialized</div>';const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));for(const [cmd,answer] of lines){if(!box.isConnected)return;for(let i=1;i<=cmd.length;i++){if(!box.isConnected)return;box.innerHTML=out+`<div class="term-command"><span class="terminal-prompt">❯</span> ${cmd.slice(0,i)}<span class="terminal-cursor"></span></div>`;if(!reduced)await sleep(42);}out+=`<div class="term-block"><div class="term-command"><span class="terminal-prompt">❯</span> ${cmd}</div><div class="term-response">${answer}</div></div>`;box.innerHTML=out;if(!reduced)await sleep(490);}box.innerHTML=out+'<div class="term-command"><span class="terminal-prompt">❯</span><span class="terminal-cursor"></span></div>';}
render();</script></body></html>
